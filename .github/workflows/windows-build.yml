name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -e ".[test,windows,build]"
      - name: Test
        run: python -m pytest
      - name: Build executable
        run: .\build_windows.ps1
      - name: Upload HandPilot
        uses: actions/upload-artifact@v4
        with:
          name: HandPilot-windows
          path: dist/GestureControl
