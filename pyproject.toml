[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-control"
version = "0.1.0"
description = "Local-first webcam gesture controller for Windows"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.10,<5",
  "mediapipe>=0.10.14,<0.11",
  "PySide6-Essentials>=6.7,<7",
  "pynput>=1.7,<2",
]

[project.optional-dependencies]
windows = [
  "pycaw>=20240210",
  "screen-brightness-control>=0.24",
]
test = [
  "pytest>=8,<9",
]
build = [
  "pyinstaller>=6,<7",
]

[project.scripts]
gesture-control = "gesture_control.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
